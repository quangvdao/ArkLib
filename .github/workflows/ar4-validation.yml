name: AR-4 isolated validation

on:
  push:
    branches: [quang/ar4-validation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ar4-isolated-validation
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply reviewed scratch edits and regenerate imports
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = quang/ar4-validation
          if [ -f .github/ar4-work.py ]; then python3 .github/ar4-work.py; fi
          ./scripts/update-lib.sh
          git add ArkLib/Interaction/Oracle ArkLibTest/Interaction/Oracle ArkLib.lean
          if [ -f .github/ar4-applied.txt ]; then git add .github/ar4-applied.txt; fi
          if ! git diff --cached --quiet; then
            git fetch origin quang/ar4-validation
            test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
            git config user.name 'Quang Dao'
            git config user.email 'qvd@andrew.cmu.edu'
            git commit -m 'chore: apply reviewed AR-4 scratch edits and generated imports'
            git push origin HEAD:quang/ar4-validation
          fi
          echo "VALIDATED_CHECKOUT=$(git rev-parse HEAD)"
      - uses: actions/cache@v6
        with:
          path: .lake
          key: ar4-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            ar4-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}
          save-always: true
      - uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch pinned dependency cache
        run: lake exe cache get
      - name: Check baseline and new source modules
        run: |
          lake build ArkLib.Interaction.Oracle.Protocol
          if [ -f ArkLib/Interaction/Oracle/Source.lean ]; then
            lake build ArkLib.Interaction.Oracle.Source ArkLibTest.Interaction.Oracle.SourceExample
          fi
          if [ -f ArkLib/Interaction/Oracle/Resource.lean ]; then
            lake build ArkLib.Interaction.Oracle.Resource ArkLibTest.Interaction.Oracle.ResourceExample
          fi
      - name: Full repository gate
        run: |
          git -C .lake/packages/VCVio submodule update --init --recursive
          ./scripts/validate.sh --axioms
          echo "PASSED_CHECKOUT=$(git rev-parse HEAD)"
